[project]
name = "dictate"
version = "0.1.0"
description = "Hold a hotkey to dictate: local speech-to-text, cleaned up and styled by a local LLM, pasted into any app."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# GTK's Python bindings (PyGObject, pycairo) aren't listed: the setup scripts take them from the system
# (Linux, macOS) or from the GTK runtime's own wheels (Windows). Linux also takes evdev from the system.
dependencies = [
    "sherpa-onnx",
    "numpy",
    "pynput; sys_platform != 'linux'",
    "sounddevice; sys_platform != 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dictate"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs the downloaded speech models (skipped when models/ is missing)"]
